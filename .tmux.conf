# Allow scrolling
set -g mouse on

# Remove delay when pressing <Esc>
set -sg escape-time 10

# Forward focus events into panes, allows auto-refresh files
set -g focus-events on

# lines of history preserved
set -g history-limit 10000

# Mouse-drag selection copies to clipboard
# Note: on Windows, replace 'pbcopy' with 'clip.exe'
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Auto renumber windows
set-option -g renumber-windows on

# Reload config prefix + r instead of a manual source-file
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Show pane title
set -g pane-border-status top
set -g pane-border-format "#{pane_index}: #{pane_title}"

# New panes inherit current pane's path. -E rebalances during pane split
bind '"' split-window -v -c "#{pane_current_path}" \; select-layout -E
bind %   split-window -h -c "#{pane_current_path}" \; select-layout -E

# Also rebalance when a pane closes
set-hook -g pane-exited 'select-layout -E'
set-hook -g after-kill-pane 'select-layout -E'

# Open floating popup into/out of "overflow" session with prefix + O,
# then prefix + d to return.
bind O display-popup -E -w 90% -h 90% "tmux new-session -A -s overflow"

# Plugins (installed/updated with prefix + I, uninstalled with prefix + alt-u)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-restore last session on tmux start, auto-save every 15 min
set -g @continuum-restore 'on'

# Initialize TPM (must come after all @plugin lines)
run '~/.tmux/plugins/tpm/tpm'

# Styling - Tokyo Night colors to match neovim's, minimalist, git branch in status bar
set -g status-style "bg=#1A1B26,fg=#a9b1d6"
set -g status-right "#[fg=#73daca]#(cd #{pane_current_path} 2>/dev/null; git branch --show-current 2>/dev/null) "
set -g status-interval 2

set -g status-left "#[fg=#2A2F41,bg=#7aa2f7,bold] #S "
set -g window-status-format "#[fg=#a9b1d6,bg=#1A1B26,nobold,noitalics,nounderscore,nodim] #I:#W "
set -g window-status-current-format "#[fg=#a9b1d6,bg=#1A1B26,nobold,noitalics,nounderscore,nodim]#[fg=#73daca,bg=#2A2F41] #[fg=#a9b1d6,bold]#I:#W#[nobold] "

set -g pane-border-style "fg=#2A2F41"
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-format "#[fg=#7aa2f7]#{pane_index}: #{pane_title}"
